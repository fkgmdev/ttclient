[package]
name = "ttcore"
version = "0.1.0"
edition = "2021"
description = "Local TikTok Android request signing primitives (no network)"

[lib]
name = "ttcore"
crate-type = ["cdylib", "rlib"]

[dependencies]
aes = "0.9"
base64 = "0.23"
block-padding = "0.4"
cbc = { version = "0.2", features = ["block-padding", "alloc"] }
cipher = { version = "0.5", features = ["alloc"] }
flate2 = "1"
hex = "0.4"
jni = "0.22"
md-5 = "0.11"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "ttcore-cli"
path = "src/bin/ttcore-cli.rs"
